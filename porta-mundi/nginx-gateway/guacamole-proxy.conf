upstream guacamole_backend {
    server host.docker.internal:8080;
    keepalive 32;
}

upstream pm2_bridge_backend {
    server host.docker.internal:5001;
    keepalive 8;
}

upstream codex_api_backend {
    server host.docker.internal:4111;
    keepalive 8;
}

server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate /etc/ssl/certs/guacamole.crt;
    ssl_certificate_key /etc/ssl/private/guacamole.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /guacamole/ {
        proxy_pass http://guacamole_backend/guacamole/;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        access_log /var/log/nginx/guacamole.access.log;
        error_log /var/log/nginx/guacamole.error.log;
    }

    location /guacamole/websocket-tunnel {
        proxy_pass http://guacamole_backend/guacamole/websocket-tunnel;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location /pm2-api/ {
        proxy_pass http://pm2_bridge_backend/;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        access_log /var/log/nginx/pm2-api.access.log;
        error_log /var/log/nginx/pm2-api.error.log;
    }

    location /codex-api/ {
        proxy_pass http://codex_api_backend/;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        access_log /var/log/nginx/codex-api.access.log;
        error_log /var/log/nginx/codex-api.error.log;
    }

    location / {
        return 301 /guacamole/;
    }
}
